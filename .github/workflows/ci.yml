name: Web CI

on:
  pull_request:
  push:
    branches: [main, performance-optimization]

permissions:
  contents: read

env:
  PERFORMANCE_SOURCES: ${{ (github.ref_name == 'performance-optimization' || github.head_ref == 'performance-optimization') && 'true' || 'false' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Check out performance engine
        if: env.PERFORMANCE_SOURCES == 'true'
        uses: actions/checkout@v4
        with:
          repository: SiglumProject/siglum
          ref: performance-optimization
          path: .local-release/sources/engine
          persist-credentials: false

      - name: Check out performance filesystem
        if: env.PERFORMANCE_SOURCES == 'true'
        uses: actions/checkout@v4
        with:
          repository: SiglumProject/siglum-filesystem
          ref: performance-optimization
          path: .local-release/sources/filesystem
          persist-credentials: false

      - name: Check out performance git
        if: env.PERFORMANCE_SOURCES == 'true'
        uses: actions/checkout@v4
        with:
          repository: SiglumProject/siglum-git
          ref: performance-optimization
          path: .local-release/sources/git
          persist-credentials: false

      - name: Install matching source libraries
        if: env.PERFORMANCE_SOURCES == 'true'
        env:
          SIGLUM_ENGINE_SOURCE: ${{ github.workspace }}/.local-release/sources/engine
          SIGLUM_FILESYSTEM_SOURCE: ${{ github.workspace }}/.local-release/sources/filesystem
          SIGLUM_GIT_SOURCE: ${{ github.workspace }}/.local-release/sources/git
        run: |
          bun run link:local
          bun run --cwd .local-release/sources/filesystem build
          bun run --cwd .local-release/sources/git build
          bun run --cwd .local-release/sources/engine build:types

      - name: Install frozen published dependencies
        if: env.PERFORMANCE_SOURCES != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check app and package Worker
        run: |
          bun run test:setup
          bun run --cwd app test
          node --check app/public/sw.js
          bun run --cwd worker check
          bun run --cwd worker test

      - name: Build the local preview
        run: bun run build:local

      - name: Build the production bundle
        run: bun run build
