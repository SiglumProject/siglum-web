name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install frozen published dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check app and package Worker
        run: |
          bun run test:setup
          bun run --cwd app test
          node --check app/public/sw.js
          bun run --cwd worker check
          bun run --cwd worker test

      - name: Build the local preview
        run: bun run build:local
